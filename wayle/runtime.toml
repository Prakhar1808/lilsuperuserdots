[general]
font-sans = "JetBrainsMono Nerd Font Propo"

[bar]
bg = "transparent"
button-variant = "basic"
button-icon-size = 0.8500000238418579
button-label-size = 0.949999988079071
button-label-weight = "medium"
button-label-padding = 0.8999999761581421
button-rounding = "md"
button-gap = 0.699999988079071

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
    "window-title",
]
center = ["media"]
right = [
    "volume",
    "microphone",
    "network",
    "battery",
    "cpu",
    "clock",
    "systray",
    "notifications",
]

[styling]
scale = 1.149999976158142
rounding = "md"

[styling.palette]
bg = "#0a0a0a"
surface = "#161616"
elevated = "#1f1f1f"
fg = "#f2f4f8"
fg-muted = "#a8aab1"
primary = "#78a9ff"
red = "#ee5396"
yellow = "#08bdba"
green = "#25be6a"
blue = "#33b1ff"

[modules.battery]
icon-color = "#deddda"
label-color = "#deddda"
button-bg-color = "#000000"

[modules.clock]
icon-color = "#deddda"
icon-bg-color = "#deddda"
label-color = "#deddda"
button-bg-color = "#000000"

[modules.cpu]
icon-color = "#deddda"
icon-bg-color = "transparent"
label-color = "#deddda"
button-bg-color = "#000000"

[modules.dashboard]
border-color = "bg-base"
icon-color = "#1a5fb4"
icon-bg-color = "bg-base"
dropdown-lock-command = "hyprlock"
dropdown-logout-command = "hyprctl dispatch exit"
dropdown-reboot-command = "reboot"
dropdown-poweroff-command = "poweroff"

[modules.hyprland-workspaces]
label-size = 0.8999999761581421
active-indicator = "underline"
active-color = "#c0bfbc"
container-bg-color = "#000000"

[modules.media]
icon-type = "application"
icon-color = "#deddda"
label-color = "#deddda"
button-bg-color = "#000000"

[modules.microphone]
icon-color = "#deddda"
icon-bg-color = "transparent"
label-color = "#deddda"
button-bg-color = "#000000"
right-click = "wayle audio input-mute"
middle-click = ""
scroll-up = "wayle audio input-volume +10"
scroll-down = "wayle audio input-volume -10"

[modules.network]
icon-color = "#deddda"
label-color = "#deddda"
button-bg-color = "#000000"

[modules.notifications]
icon-color = "#deddda"
icon-bg-color = "transparent"
label-color = "#deddda"
button-bg-color = "#000000"

[modules.systray]
button-bg-color = "#000000"

[modules.volume]
icon-color = "#deddda"
icon-bg-color = "transparent"
label-color = "#deddda"
button-bg-color = "#000000"
right-click = "pavucontrol"
middle-click = ""
scroll-up = "wayle audio output-volume +5"
scroll-down = "wayle audio output-volume -10"

[modules.window-title]
icon-color = "#deddda"
icon-bg-color = "transparent"
label-color = "#deddda"
label-max-length = 20
button-bg-color = "#000000"

[osd]
margin = 90.0

[wallpaper]
engine-enabled = false
